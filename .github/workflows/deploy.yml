# Deploy pelo GitHub Actions — OPCIONAL.
# Use este OU a integração Git do Cloudflare (Workers Builds), não os dois.
# Para ativar: em Settings > Secrets and variables > Actions, crie
#   CLOUDFLARE_API_TOKEN  (permissões: Workers Scripts, D1, R2, Account Settings: Edit)
#   CLOUDFLARE_ACCOUNT_ID
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Pular quando o token não está configurado
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "CLOUDFLARE_API_TOKEN não configurado — deploy via Actions desativado (use o Workers Builds)."
      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: env.CLOUDFLARE_API_TOKEN != ''
      - run: npm test
        if: env.CLOUDFLARE_API_TOKEN != ''
      - name: Publicar no Cloudflare Workers
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
      - name: Aplicar migrações do D1
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler d1 migrations apply DB --remote
